name: publish

# npm への公開。手動で起動した時だけ走る（push・pull_request では走らない）。
# token は repo の secret NPM_TOKEN だけを使う。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { key: darwin-arm64, runner: macos-15 }
          - { key: darwin-x64, runner: macos-15-intel }
          - { key: linux-x64, runner: ubuntu-24.04 }
          - { key: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: superbash-${{ matrix.key }}
          path: target/release/superbash
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/bin
      - name: 5 つの package を組み立てて中身を確かめる
        run: |
          D="$RUNNER_TEMP/bin"
          node scripts/stage-npm.mjs "$RUNNER_TEMP/stage" \
            darwin-arm64="$D/superbash-darwin-arm64/superbash" \
            darwin-x64="$D/superbash-darwin-x64/superbash" \
            linux-arm64="$D/superbash-linux-arm64/superbash" \
            linux-x64="$D/superbash-linux-x64/superbash"
          node scripts/pack-check.mjs "$RUNNER_TEMP/stage"
      - name: OS・CPU ごとの package を先に、本体を最後に公開する
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          S="$RUNNER_TEMP/stage"
          npm publish "$S/superbash-darwin-arm64" --access public --provenance
          npm publish "$S/superbash-darwin-x64" --access public --provenance
          npm publish "$S/superbash-linux-arm64" --access public --provenance
          npm publish "$S/superbash-linux-x64" --access public --provenance
          npm publish "$S/superbash" --access public --provenance
