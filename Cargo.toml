[package]
name = "superbash"
version = "0.2.0"
license = "MIT"
edition = "2024"

[dependencies]
sha2 = "0.10"
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
flate2 = "1.1.11"
libc = "0.2"
rmcp = { version = "3.11.0", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "net", "signal"] }

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
