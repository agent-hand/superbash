[package]
name = "superbash"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
flate2 = "1.1.11"
libc = "0.2"
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client", "transport-child-process"] }
